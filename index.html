<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabella Tolleranze ISO Salerno Giuseppe</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            text-align: center;
            color: #0056b3;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #004095;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eef2f7;
            border-left: 5px solid #0056b3;
            border-radius: 4px;
            display: none;
        }
        .result p {
            margin: 5px 0;
        }
        .info-note {
            font-size: 0.85rem;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tabella Matrice Tolleranze ISO</h2>
    
    <div class="form-group">
        <label for="diametro">Diametro Nominale (mm):</label>
        <input type="number" id="diametro" step="0.01" placeholder="es. 2.5">
    </div>
    
    <div class="form-group">
        <label for="grado">Grado di Tolleranza:</label>
        <select id="grado">
            <option value="IT1">IT1</option>
            <option value="IT2">IT2</option>
            <option value="IT3">IT3</option>
            <option value="IT4">IT4</option>
            <option value="IT5">IT5</option>
            <option value="IT6" selected>IT6</option>
            <option value="IT7">IT7</option>
            <option value="IT8">IT8</option>
            <option value="IT9">IT9</option>
            <option value="IT10">IT10</option>
            <option value="IT11">IT11</option>
            <option value="IT12">IT12</option>
            <option value="IT13">IT13</option>
            <option value="IT14">IT14</option>
            <option value="IT15">IT15</option>
            <option value="IT16">IT16</option>
            <option value="IT17">IT17</option>
            <option value="IT18">IT18</option>
        </select>
    </div>

    <button onclick="trovaTolleranzaTabella()">Cerca in Tabella</button>

    <div id="resultBox" class="result">
        <p><strong>Intervallo Dimensionale:</strong> <span id="resIntervallo">-</span></p>
        <p><strong>Valore Tolleranza:</strong> <span id="resValore">-</span> &mu;m</p>
    </div>

    <div class="info-note">
        Prof. Giuseppe Salerno - Docente di Scienze e Tecnologie Meccaniche presso IS Palmieri di Benevento. salernog_1@libero.it
    </div>
</div>

<script>
    // 1. I 21 Intervalli dimensionali standard (limiti superiori in mm)
    // Indice 0 = fino a 3mm, Indice 1 = da 3 a 6mm, ecc.
    const limitiIntervalli = [3, 6, 10, 18, 30, 50, 80, 120, 180, 250, 315, 400, 500, 630, 800, 1000, 1200, 1600, 2000, 2500, 3150];
    
    const nomiIntervalli = [
        "fino a 3", "da 3 a 6", "da 6 a 10", "da 10 a 18", "da 18 a 30", 
        "da 30 a 50", "da 50 a 80", "da 80 a 120", "da 120 a 180", "da 180 a 250", 
        "da 250 a 315", "da 315 a 400", "da 400 a 500", "da 500 a 630", "da 630 a 800", 
        "da 800 a 1000", "da 1000 a 1200", "da 1200 a 1600", "da 1600 a 2000", "da 2000 a 2500", "da 2500 a 3150"
    ];

    // 2. LA MATRICE DEI DATI (Righe = Intervalli, Colonne = Gradi IT1 a IT18)
    // Ogni riga corrisponde a un intervallo. I valori sono espressi in micron (μm).
    // NOTA: Qui inserisci i tuoi dati esatti. Nell'esempio ho messo valori reali per i primi intervalli e gradi.
    const tabellaTolleranze = [
        // IT1, IT2, IT3, IT4, IT5, IT6, IT7, IT8, IT9, IT10, IT11, IT12, IT13, IT14, IT15, IT16, IT17, IT18
        [ 0.8, 1.2,   2,   3,   4,   6,  10,  14,  25,  40,  60, 100, 140, 250, 400, 600, 1000, 1400 ], // fino a 3
        [   1, 1.5,   2.5,   4,   5,   8,  12,  18,  30,  48,  75, 120, 180, 300, 480, 750, 1200, 1800 ], // da 3 a 6
        [   1, 1.5, 2.5,   4,   6,   9,  15,  22,  36,  58,  90, 150, 220, 360, 580, 900, 1500, 2200 ], // da 6 a 10
      [  1.2, 2, 3,   5,   8,   11,  18,  27,  43,  70,  110, 180, 270, 430, 700, 1100, 1800, 2700 ], // da 10 a 18
      [1.5, 2.5, 4, 6, 9, 13, 21, 33, 52, 84, 130, 210 ,330, 520, 840, 1300, 2100, 3300],// da 18 a 30
      [1.5, 2, 4, 7, 11, 16, 25, 39, 62, 100, 160,  250, 390, 620, 1000, 1600, 2500, 3900], // da 30 a 50
      [2, 3, 5, 8, 13, 19, 30, 46, 74, 120, 190, 300, 460, 740, 1200, 1900, 3000, 4600], // da 50 a 80 
      [2.5, 4, 6, 10, 15, 22, 35, 54, 87, 140, 220, 350, 540, 870, 1400, 2200, 3500, 5400], // da 80 a 120 
      [3.5, 5, 8, 12, 18, 25, 40, 63, 100, 160, 250, 400, 630, 1000, 1600, 2500, 4000, 6300 ], // da 120 a 180
      [4.5, 7, 10, 14, 20, 29, 46, 72, 115, 185, 290, 460, 720, 1150, 1850, 2900, 4600, 7200 ], // da 180 a 250
      [6, 8, 12, 16, 23, 32, 52, 81, 130, 210, 320, 520, 810, 1300, 2100, 3200, 5200, 8100 ], // da 250 a 315
      [7, 9, 13, 18, 25, 36, 57, 89, 140, 230, 360, 570, 890, 1400, 2300, 3600, 5700, 8900 ], // da 315 a 400
      [8, 10, 15, 20, 27, 40, 63, 97, 155, 250, 400, 630, 970, 1550, 2500, 4000, 6300, 9700], // da 400 a 500
      [9, 11, 16, 22, 32, 44, 70, 110, 175, 280, 440, 700, 1100, 1750, 2800, 4400, 7000, 11000], // da 500 a 630  
      [10, 13, 18, 25, 36, 50, 80, 125, 200, 320, 500, 800, 1250, 2000, 3200, 5000, 8000, 12500], // da 630 a 800 
      [11 ,15, 21, 28, 40, 56, 90, 140, 230, 360, 560, 900, 1400, 2300, 3600, 5600, 9000, 14000], // da 800 a 1000
     [13, 18, 24, 33, 47, 66, 105, 165, 260, 420, 660, 1050, 1650, 2600, 4200, 6600, 10500, 16500], // da 1000 a 1250
    [15, 21, 29, 39, 55, 78, 125, 195, 310, 500, 780, 1250, 1950, 3100, 5000, 7800, 12500, 19500], // da 1250  a 1600
   [18, 25, 35, 46, 65, 92, 150, 230, 370, 600, 920, 1500, 2300, 3700, 6000, 9200, 15000, 23000], // da 1600 a 2000
  [22, 30, 41, 55, 78, 110, 175, 280, 440, 700, 1100, 1750, 2800, 4400, 7000, 11000, 17500, 28000], // da 2000 a 2500
 [26, 36, 50, 68, 96, 135, 210, 330, 540, 860, 1350, 2100, 3300, 5400, 8600, 13500, 21000, 33000], // da 2500 a 3150
 
        // ... (puoi aggiungere o modificare facilmente tutte le altre righe fino alla 21esima)
    ];

    // Mappa per associare il nome del grado alla colonna corrispondente (0 = IT1, 1 = IT2, ...)
    const mappaGradi = {
        "IT1": 0, "IT2": 1, "IT3": 2, "IT4": 3, "IT5": 4, "IT6": 5, 
        "IT7": 6, "IT8": 7, "IT9": 8, "IT10": 9, "IT11": 10, "IT12": 11, 
        "IT13": 12, "IT14": 13, "IT15": 14, "IT16": 15, "IT17": 16, "IT18": 17
    };

    function trovaTolleranzaTabella() {
        let d = parseFloat(document.getElementById('diametro').value);
        let gradoSelezionato = document.getElementById('grado').value;

        if (isNaN(d) || d <= 0) {
            alert("Inserisci un diametro valido.");
            return;
        }

        // Trova a quale dei 21 intervalli appartiene il diametro inserito
        let indiceIntervallo = -1;
        for (let i = 0; i < limitiIntervalli.length; i++) {
            let limiteInf = (i === 0) ? 0 : limitiIntervalli[i - 1];
            let limiteSup = limitiIntervalli[i];
            
            if (d > limiteInf && d <= limiteSup) {
                indiceIntervallo = i;
                break;
            }
        }

        if (indiceIntervallo === -1 || indiceIntervallo >= tabellaTolleranze.length) {
            alert("Diametro fuori dai limiti inseriti in tabella o riga non ancora compilata.");
            return;
        }

        // Estrae il valore incrociando riga (intervallo) e colonna (grado)
        let colonnaGrado = mappaGradi[gradoSelezionato];
        let valore = tabellaTolleranze[indiceIntervallo][colonnaGrado];

        // Mostra il risultato a schermo
        document.getElementById('resIntervallo').innerText = nomiIntervalli[indiceIntervallo];
        document.getElementById('resValore').innerText = valore !== undefined ? valore : "Dato non presente";
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
